<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nantonik Street View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="streetview" class="streetview"></div>
      <div id="placeholder" class="placeholder">
        <span>Select a location to enter Street View</span>
      </div>

      <div id="compass" class="compass is-hidden" aria-hidden="true">
        <div id="compassNeedle" class="compass-needle"></div>
        <!-- <div class="compass-center"></div> -->
        <!-- <div class="compass-north">N</div> -->
      </div>

      <div class="overlay picker">
        <div id="map" class="map"></div>
        <div class="map-controls-row">
          <div class="map-controls" role="group" aria-label="Map mode">
            <button
              id="mapMode"
              class="toggle-btn is-active"
              type="button"
              title="Map (Q)"
            >
              Map
            </button>
            <button
              id="hybridMode"
              class="toggle-btn"
              type="button"
              title="Hybrid (W)"
            >
              Hybrid
            </button>
            <button
              id="satelliteMode"
              class="toggle-btn"
              type="button"
              title="Satellite (E)"
            >
              Satellite
            </button>
          </div>
          <div
            class="map-controls map-controls-secondary"
            role="group"
            aria-label="Street View coverage"
          >
            <button
              id="coverageToggle"
              class="toggle-btn"
              type="button"
              title="Street View coverage (S)"
            >
              <i class="fa-solid fa-car-side" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="overlay api-key">
        <div class="api-title">Google API Key</div>
        <div class="api-row">
          <input
            id="apiKeyInput"
            class="api-input"
            type="password"
            placeholder="Enter API key"
            autocomplete="off"
          />
          <button id="saveApiKey" class="api-button" type="button">Save</button>
        </div>
        <div id="apiHint" class="api-hint">
          Key is stored locally in your browser.
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
